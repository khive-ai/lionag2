[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lionag2"
version = "0.2.0"
description = "Native AG2-beta recursive exploratory research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ocean" }]
dependencies = [
  "ag2[openai]>=0.12.3",
  "pydantic>=2.7",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]
server = ["starlette>=0.37", "uvicorn[standard]>=0.30", "ag2[ag-ui]>=0.12.3"]
khive = ["khive>=1.0.0rc"]

[project.scripts]
lionag2 = "lionag2.cli:main"
lionag2-server = "lionag2.server:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/lionag2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
