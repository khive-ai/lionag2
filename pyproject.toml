[project]
name = "lionag2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ag2[ag-ui,gemini,openai]>=0.12.2",
    "daytona>=0.171",
    "daytona-sdk>=0.10",
    "fastapi>=0.115.14",
    "lionagi[graph]>=0.23.3",
    "mcp[cli]>=1.27.0",
    "nlip-sdk>=0.1.2",
    "nlip-server>=0.1.2",
    "tavily-python>=0.7.24",
    "uvicorn>=0.46.0",
    # Pre-installed for the agent code sandbox so it doesn't reinstall every run
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "httpx>=0.27",
    "khive>=1.0.0rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lionag2"]
artifacts = ["src/lionag2/py.typed"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "N", "S", "A"]
ignore = [
    "N805",
    "A004",
    "UP035",
    "S101",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B904", "N"]
"examples/**" = ["S101", "B904", "N"]
