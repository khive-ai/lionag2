[project]
name = "lionag2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lionagi[ag2,graph]>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lionag2"]
artifacts = ["src/lionag2/py.typed"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "N", "S", "A"]
ignore = [
    "N805",
    "A004",
    "UP035",
    "S101",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B904", "N"]
"examples/**" = ["S101", "B904", "N"]
